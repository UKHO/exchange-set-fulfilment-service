parameters:
# The name of the service connection for deployment.
- name: AzureSubscription
  type: string
# The name of the container app to deploy.
- name: AppName
  type: string
# If true, additional debugging will be enabled.
- name: AdditionalDebugging
  type: boolean
  default: true
# Skip deployment if false.
- name: DeployApp
  type: boolean
  default: true

steps:
- task: AzureCLI@2
  displayName: Deploy ${{ parameters.AppName }}
  condition: and(succeeded(), eq('${{ parameters.DeployApp }}', true))
  inputs:
    azureSubscription: ${{ parameters.AzureSubscription }}
    workingDirectory: $(Build.SourcesDirectory)/efs/src/UKHO.ADDS.EFS.LocalHost
    scriptType: bash
    scriptLocation: inlineScript
    ${{ if eq(parameters.AdditionalDebugging, true) }}:
      inlineScript: |
        set -e
        APP_NAME="${{ parameters.AppName }}"
        APP_SLUG="${APP_NAME//[^a-zA-Z0-9-]/-}"

        echo "========== ASPIRE PROJECTS =========="
        find . -name "*.csproj"

        echo "========== EXISTING BICEP FILES =========="
        find . -type f \( -name "*.bicep" -o -name "*.bicepparam" \)

        CAPTURE_DIR="$(Build.ArtifactStagingDirectory)/azd-bicep-debug/$APP_SLUG"
        mkdir -p "$CAPTURE_DIR"

        echo "========== STARTING TEMP FOLDER WATCHER =========="
        (
          while true; do
            for dir in /tmp/*-build*; do
              if [ -d "$dir" ]; then
                target="$CAPTURE_DIR/$(basename "$dir")"
                mkdir -p "$target"
                cp -a "$dir/." "$target/" 2>/dev/null || true
              fi
            done
            sleep 0.1
          done
        ) &
        WATCHER_PID=$!

        echo "========== STARTING DEPLOYMENT =========="
        set +e
        azd deploy "$APP_NAME" --no-prompt --debug
        DEPLOY_EXIT_CODE=$?
        set -e

        echo "========== TMP BUILD DIRECTORIES (LIVE) =========="
        find /tmp -maxdepth 1 -type d -name "*-build*" -print || true

        echo "========== COPYING TMP BUILD DIRECTORIES (FINAL SNAPSHOT) =========="
        for dir in /tmp/*-build*; do
          if [ -d "$dir" ]; then
            target="$CAPTURE_DIR/$(basename "$dir")"
            mkdir -p "$target"
            cp -a "$dir/." "$target/" 2>/dev/null || true
            echo "copied: $dir -> $target"
          fi
        done

        kill "$WATCHER_PID" 2>/dev/null || true
        wait "$WATCHER_PID" 2>/dev/null || true

        echo "========== CAPTURED BICEP FILES =========="
        find "$CAPTURE_DIR" -type f -printf '%P\n' || true

        echo "========== CAPTURED MAIN PARAM FILES =========="
        find "$CAPTURE_DIR" -name "main.bicepparam" -exec sh -c 'echo "--- $1"; sed -n "1,80p" "$1"' _ {} \; || true

        echo "========== GENERATED PARAMETER FILE HEADERS =========="
        find "$CAPTURE_DIR" -name "*.bicepparam" -exec sh -c 'echo "--- $1"; head -n 20 "$1"' _ {} \; || true

        echo "========== GENERATED MODULE FILES =========="
        find "$CAPTURE_DIR" -name "*.module.bicep" -exec sh -c 'echo "--- $1"; sed -n "1,220p" "$1"' _ {} \; || true

        exit "$DEPLOY_EXIT_CODE"
       
    ${{ else }}:
      inlineScript: |
        azd deploy ${{ parameters.AppName }} --no-prompt
  env:
    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
    AZURE_ENV_NAME: $(AZURE_ENV_NAME)
    AZURE_LOCATION: $(AZURE_LOCATION)
    AZURE_SUBNET_RESOURCE_ID: $(AZURE_SUBNET_RESOURCE_ID)
    AZURE_ADDS_ENVIRONMENT: $(AZURE_ENV_NAME)
    AZURE_ORCHESTRATOR_CPU: $(AZURE_ORCHESTRATOR_CPU)
    AZURE_ORCHESTRATOR_MEMORY: $(AZURE_ORCHESTRATOR_MEMORY)
    AZURE_ADDS_MOCKS_CPU: $(AZURE_ADDS_MOCKS_CPU)
    AZURE_ADDS_MOCKS_MEMORY: $(AZURE_ADDS_MOCKS_MEMORY)
    AZURE_EFS_APP_REG_CLIENT_ID: $(AZURE_EFS_APP_REG_CLIENT_ID)
    AZURE_EFS_APP_REG_TENANT_ID: $(AZURE_EFS_APP_REG_TENANT_ID)
    AZURE_EFS_B2C_APP_CLIENT_ID: $(AZURE_EFS_B2C_APP_CLIENT_ID)
    AZURE_EFS_B2C_APP_DOMAIN : $(AZURE_EFS_B2C_APP_DOMAIN)
    AZURE_EFS_B2C_APP_INSTANCE : $(AZURE_EFS_B2C_APP_INSTANCE)
    AZURE_EFS_B2C_APP_SIGNIN_POLICY : $(AZURE_EFS_B2C_APP_SIGNIN_POLICY)
    AZURE_EFS_B2C_APP_TENANT_ID : $(AZURE_EFS_B2C_APP_TENANT_ID)
    AZURE_ELASTIC_APMAPI_KEY: $(AZURE_ELASTIC_APMAPI_KEY)
    AZURE_ELASTIC_APMSERVER_URL: $(AZURE_ELASTIC_APMSERVER_URL)
    AZURE_ELASTIC_APMENVIRONMENT: $(AZURE_ELASTIC_APMENVIRONMENT)
    AZURE_ELASTIC_APMSERVICE_NAME: $(AZURE_ELASTIC_APMSERVICE_NAME)
