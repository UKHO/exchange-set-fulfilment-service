parameters:
# The name of the service connection for deployment.
- name: AzureSubscription
  type: string
# The name of the container app to deploy.
- name: AppName
  type: string
# If true, additional debugging will be enabled.
- name: AdditionalDebugging
  type: boolean
  default: true
# Skip deployment if false.
- name: DeployApp
  type: boolean
  default: true

steps:
- task: AzureCLI@2
  displayName: Deploy ${{ parameters.AppName }}
  condition: and(succeeded(), eq('${{ parameters.DeployApp }}', true))
  inputs:
    azureSubscription: ${{ parameters.AzureSubscription }}
    workingDirectory: $(Build.SourcesDirectory)/efs/src/UKHO.ADDS.EFS.LocalHost
    scriptType: bash
    scriptLocation: inlineScript
    ${{ if eq(parameters.AdditionalDebugging, true) }}:
      inlineScript: |
        set -e
          echo "Checking Aspire deployment artifacts..."
         find . -type f \( -name "*.bicep" -o -name "*.bicepparam" \) -print

          echo "Checking generated module references..."
           grep -R "using './efs-redis" . \
            --include="*.bicepparam" || true

         EVENTHUBS_HOSTNAME="$EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME"
         EVENTHUBS_ENDPOINT="$EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT"

         if [ -z "$EVENTHUBS_ENDPOINT" ]; then
           EVENTHUBS_ENDPOINT=$(azd env get-value EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT 2>/dev/null || true)
         fi

         if [[ "$EVENTHUBS_ENDPOINT" == ERROR:* ]]; then
           EVENTHUBS_ENDPOINT=""
         fi

         if [ -z "$EVENTHUBS_ENDPOINT" ] && [ -n "$EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT" ]; then
           EVENTHUBS_ENDPOINT="$EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT"
         fi

         if [ -z "$EVENTHUBS_ENDPOINT" ] && [ -n "$AZURE_EFS_EVENT_HUBS_NAMESPACE_NAME" ] && [ -n "$AZURE_EFS_RETAIN_RESOURCE_GROUP" ]; then
           EVENTHUBS_ENDPOINT=$(az eventhubs namespace show --name "$AZURE_EFS_EVENT_HUBS_NAMESPACE_NAME" --resource-group "$AZURE_EFS_RETAIN_RESOURCE_GROUP" --query "properties.serviceBusEndpoint" --output tsv)
           if [ -n "$EVENTHUBS_ENDPOINT" ]; then
             azd env set EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT "$EVENTHUBS_ENDPOINT"
           fi
         fi

          if [ -n "$EVENTHUBS_ENDPOINT" ]; then
            azd env set EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT "$EVENTHUBS_ENDPOINT"
          fi

          if [ -z "$EVENTHUBS_HOSTNAME" ] && [ -n "$EVENTHUBS_ENDPOINT" ]; then
            EVENTHUBS_HOSTNAME=$(echo "$EVENTHUBS_ENDPOINT" | sed -E -e 's#^[a-z]+://##' -e 's#:[0-9]+/?$##' -e 's#/$##')
          fi

          if [ -n "$EVENTHUBS_HOSTNAME" ]; then
            azd env set EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME "$EVENTHUBS_HOSTNAME"
         fi

          if [ -z "$EVENTHUBS_HOSTNAME" ]; then
            EVENTHUBS_HOSTNAME=$(azd env get-values | sed -n 's/^EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME=//p' | tail -n 1)
          fi
          if [[ "$EVENTHUBS_HOSTNAME" == ERROR:* ]]; then
            EVENTHUBS_HOSTNAME=""
          fi
          if [ -n "$EVENTHUBS_HOSTNAME" ]; then
           export EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME="$EVENTHUBS_HOSTNAME"
         fi

          echo "EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT=${EVENTHUBS_ENDPOINT}"
          echo "EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME=${EVENTHUBS_HOSTNAME}"

          if [ -z "$EVENTHUBS_HOSTNAME" ]; then
            echo "Failed to resolve EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME in azd env."
            azd env get-values | grep EFS_EVENTS_NAMESPACE || true
            exit 1
          fi

          ORCHESTRATOR_IDENTITY_ID="${EFS_SERVICE_IDENTITY_ID:-}"
          if [ -z "$ORCHESTRATOR_IDENTITY_ID" ]; then
            ORCHESTRATOR_IDENTITY_ID=$(azd env get-value EFS_SERVICE_IDENTITY_ID 2>/dev/null || true)
          fi

          if [[ "$ORCHESTRATOR_IDENTITY_ID" == ERROR:* ]] || [[ "$ORCHESTRATOR_IDENTITY_ID" == '$('* ]]; then
            ORCHESTRATOR_IDENTITY_ID=""
          fi

          REGISTRY_IDENTITY_ID=$(azd env get-value EFS_CAE_AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID 2>/dev/null || true)

          if [[ "$REGISTRY_IDENTITY_ID" == ERROR:* ]] || [[ "$REGISTRY_IDENTITY_ID" == '$('* ]]; then
            REGISTRY_IDENTITY_ID=""
          fi

          if [ -z "$REGISTRY_IDENTITY_ID" ] && [ -n "$ORCHESTRATOR_IDENTITY_ID" ]; then
            azd env set EFS_CAE_AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID "$ORCHESTRATOR_IDENTITY_ID"
            REGISTRY_IDENTITY_ID="$ORCHESTRATOR_IDENTITY_ID"
          fi

          if [ -n "$ORCHESTRATOR_IDENTITY_ID" ] && [ "$ORCHESTRATOR_IDENTITY_ID" = "$REGISTRY_IDENTITY_ID" ]; then
            CAE_IDENTITY_ID=$(az containerapp env show --name "$AZURE_EFS_CONTAINER_APPS_ENVIRONMENT_NAME" --resource-group "$AZURE_EFS_RETAIN_RESOURCE_GROUP" --query "identity.userAssignedIdentities | keys(@) | [0]" --output tsv 2>/dev/null || true)

            if [ -n "$CAE_IDENTITY_ID" ] && [ "$CAE_IDENTITY_ID" != "null" ] && [ "$CAE_IDENTITY_ID" != "$ORCHESTRATOR_IDENTITY_ID" ]; then
              azd env set EFS_CAE_AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID "$CAE_IDENTITY_ID"
              REGISTRY_IDENTITY_ID="$CAE_IDENTITY_ID"
            fi
          fi

          if [ -n "$ORCHESTRATOR_IDENTITY_ID" ] && [ "$ORCHESTRATOR_IDENTITY_ID" = "$REGISTRY_IDENTITY_ID" ]; then
            echo "Identity collision detected: EFS_CAE_AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID matches EFS_SERVICE_IDENTITY_ID."
            echo "Set a distinct registry pull identity for the Container Apps environment and rerun deploy."
            exit 1
          fi

         echo "========== STARTING DEPLOYMENT =========="
          azd deploy ${{ parameters.AppName }} --no-prompt --debug
       
    ${{ else }}:
      inlineScript: |
  
         echo "Checking Aspire deployment artifacts..."
         find . -type f \( -name "*.bicep" -o -name "*.bicepparam" \) -print

          echo "Checking generated module references..."
           grep -R "using './efs-redis" . \
            --include="*.bicepparam" || true

         EVENTHUBS_HOSTNAME="$EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME"
         EVENTHUBS_ENDPOINT="$EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT"

         if [ -z "$EVENTHUBS_ENDPOINT" ]; then
           EVENTHUBS_ENDPOINT=$(azd env get-value EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT 2>/dev/null || true)
         fi

         if [[ "$EVENTHUBS_ENDPOINT" == ERROR:* ]]; then
           EVENTHUBS_ENDPOINT=""
         fi

         if [ -z "$EVENTHUBS_ENDPOINT" ] && [ -n "$EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT" ]; then
           EVENTHUBS_ENDPOINT="$EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT"
         fi

         if [ -z "$EVENTHUBS_ENDPOINT" ] && [ -n "$AZURE_EFS_EVENT_HUBS_NAMESPACE_NAME" ] && [ -n "$AZURE_EFS_RETAIN_RESOURCE_GROUP" ]; then
           EVENTHUBS_ENDPOINT=$(az eventhubs namespace show --name "$AZURE_EFS_EVENT_HUBS_NAMESPACE_NAME" --resource-group "$AZURE_EFS_RETAIN_RESOURCE_GROUP" --query "properties.serviceBusEndpoint" --output tsv)
           if [ -n "$EVENTHUBS_ENDPOINT" ]; then
             azd env set EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT "$EVENTHUBS_ENDPOINT"
           fi
         fi

          if [ -n "$EVENTHUBS_ENDPOINT" ]; then
            azd env set EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT "$EVENTHUBS_ENDPOINT"
          fi

          if [ -z "$EVENTHUBS_HOSTNAME" ] && [ -n "$EVENTHUBS_ENDPOINT" ]; then
            EVENTHUBS_HOSTNAME=$(echo "$EVENTHUBS_ENDPOINT" | sed -E -e 's#^[a-z]+://##' -e 's#:[0-9]+/?$##' -e 's#/$##')
          fi

          if [ -n "$EVENTHUBS_HOSTNAME" ]; then
            azd env set EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME "$EVENTHUBS_HOSTNAME"
         fi

          if [ -z "$EVENTHUBS_HOSTNAME" ]; then
            EVENTHUBS_HOSTNAME=$(azd env get-values | sed -n 's/^EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME=//p' | tail -n 1)
          fi
          if [[ "$EVENTHUBS_HOSTNAME" == ERROR:* ]]; then
            EVENTHUBS_HOSTNAME=""
          fi
          if [ -n "$EVENTHUBS_HOSTNAME" ]; then
           export EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME="$EVENTHUBS_HOSTNAME"
         fi

          echo "EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT=${EVENTHUBS_ENDPOINT}"
          echo "EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME=${EVENTHUBS_HOSTNAME}"

          if [ -z "$EVENTHUBS_HOSTNAME" ]; then
            echo "Failed to resolve EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME in azd env."
            azd env get-values | grep EFS_EVENTS_NAMESPACE || true
            exit 1
          fi

          ORCHESTRATOR_IDENTITY_ID="${EFS_SERVICE_IDENTITY_ID:-}"
          if [ -z "$ORCHESTRATOR_IDENTITY_ID" ]; then
            ORCHESTRATOR_IDENTITY_ID=$(azd env get-value EFS_SERVICE_IDENTITY_ID 2>/dev/null || true)
          fi

          if [[ "$ORCHESTRATOR_IDENTITY_ID" == ERROR:* ]] || [[ "$ORCHESTRATOR_IDENTITY_ID" == '$('* ]]; then
            ORCHESTRATOR_IDENTITY_ID=""
          fi

          REGISTRY_IDENTITY_ID=$(azd env get-value EFS_CAE_AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID 2>/dev/null || true)

          if [[ "$REGISTRY_IDENTITY_ID" == ERROR:* ]] || [[ "$REGISTRY_IDENTITY_ID" == '$('* ]]; then
            REGISTRY_IDENTITY_ID=""
          fi

          if [ -z "$REGISTRY_IDENTITY_ID" ] && [ -n "$ORCHESTRATOR_IDENTITY_ID" ]; then
            azd env set EFS_CAE_AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID "$ORCHESTRATOR_IDENTITY_ID"
            REGISTRY_IDENTITY_ID="$ORCHESTRATOR_IDENTITY_ID"
          fi

          if [ -n "$ORCHESTRATOR_IDENTITY_ID" ] && [ "$ORCHESTRATOR_IDENTITY_ID" = "$REGISTRY_IDENTITY_ID" ]; then
            CAE_IDENTITY_ID=$(az containerapp env show --name "$AZURE_EFS_CONTAINER_APPS_ENVIRONMENT_NAME" --resource-group "$AZURE_EFS_RETAIN_RESOURCE_GROUP" --query "identity.userAssignedIdentities | keys(@) | [0]" --output tsv 2>/dev/null || true)

            if [ -n "$CAE_IDENTITY_ID" ] && [ "$CAE_IDENTITY_ID" != "null" ] && [ "$CAE_IDENTITY_ID" != "$ORCHESTRATOR_IDENTITY_ID" ]; then
              azd env set EFS_CAE_AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID "$CAE_IDENTITY_ID"
              REGISTRY_IDENTITY_ID="$CAE_IDENTITY_ID"
            fi
          fi

          if [ -n "$ORCHESTRATOR_IDENTITY_ID" ] && [ "$ORCHESTRATOR_IDENTITY_ID" = "$REGISTRY_IDENTITY_ID" ]; then
            echo "Identity collision detected: EFS_CAE_AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID matches EFS_SERVICE_IDENTITY_ID."
            echo "Set a distinct registry pull identity for the Container Apps environment and rerun deploy."
            exit 1
          fi

         echo "========== STARTING DEPLOYMENT =========="
          azd deploy ${{ parameters.AppName }} --no-prompt --debug
  env:
    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
    AZURE_ENV_NAME: $(AZURE_ENV_NAME)
    AZURE_LOCATION: $(AZURE_LOCATION)
    AZURE_SUBNET_RESOURCE_ID: $(AZURE_SUBNET_RESOURCE_ID)
    AZURE_ADDS_ENVIRONMENT: $(AZURE_ENV_NAME)
    AZURE_ORCHESTRATOR_CPU: $(AZURE_ORCHESTRATOR_CPU)
    AZURE_ORCHESTRATOR_MEMORY: $(AZURE_ORCHESTRATOR_MEMORY)
    AZURE_ADDS_MOCKS_CPU: $(AZURE_ADDS_MOCKS_CPU)
    AZURE_ADDS_MOCKS_MEMORY: $(AZURE_ADDS_MOCKS_MEMORY)
    AZURE_EFS_APP_REG_CLIENT_ID: $(AZURE_EFS_APP_REG_CLIENT_ID)
    AZURE_EFS_APP_REG_TENANT_ID: $(AZURE_EFS_APP_REG_TENANT_ID)
    AZURE_EFS_B2C_APP_CLIENT_ID: $(AZURE_EFS_B2C_APP_CLIENT_ID)
    AZURE_EFS_B2C_APP_DOMAIN : $(AZURE_EFS_B2C_APP_DOMAIN)
    AZURE_EFS_B2C_APP_INSTANCE : $(AZURE_EFS_B2C_APP_INSTANCE)
    AZURE_EFS_B2C_APP_SIGNIN_POLICY : $(AZURE_EFS_B2C_APP_SIGNIN_POLICY)
    AZURE_EFS_B2C_APP_TENANT_ID : $(AZURE_EFS_B2C_APP_TENANT_ID)
    AZURE_EFS_EVENT_HUBS_NAMESPACE_NAME: $(AZURE_EFS_EVENT_HUBS_NAMESPACE_NAME)
    AZURE_EFS_RETAIN_RESOURCE_GROUP: $(AZURE_EFS_RETAIN_RESOURCE_GROUP)
    AZURE_EFS_CONTAINER_APPS_ENVIRONMENT_NAME: $(AZURE_EFS_CONTAINER_APPS_ENVIRONMENT_NAME)
    AZURE_ELASTIC_APMAPI_KEY: $(AZURE_ELASTIC_APMAPI_KEY)
    AZURE_ELASTIC_APMSERVER_URL: $(AZURE_ELASTIC_APMSERVER_URL)
    AZURE_ELASTIC_APMENVIRONMENT: $(AZURE_ELASTIC_APMENVIRONMENT)
    AZURE_ELASTIC_APMSERVICE_NAME: $(AZURE_ELASTIC_APMSERVICE_NAME)
    EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT: $(EFS_EVENTS_NAMESPACE_EVENTHUBSENDPOINT)
    EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME: $(AZURE_EFS_EVENTS_NAMESPACE_EVENTHUBSHOSTNAME)
